<!doctype html>
<!--
THESIS: A light table, not a landing page: the page sequence is the interface and a split is a cut line drawn between pages. Refuses the upload-dropzone-plus-marketing-sections arrangement.
OWN-WORLD: Cool pale-grey table, white page tiles with offset shadows, ink type, one vermilion reserved for cut lines and the primary action. System fonts.
STORY: Drop PDFs, see every page, drag or nudge them into order, snip between pages, download. Nothing leaves the tab.
FIRST VIEWPORT: Empty: one centered drop target with a single action. Loaded: toolbar above a page grid, export sidebar at right.
FORM: Operate-mode proof-sheet grid; cut slots live in the gaps between page cards.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pagix is a private PDF page organizer. Merge, reorder and split PDFs entirely in your browser." />
    <meta name="theme-color" content="#eceef1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pagix — split, merge, shuffle PDFs in your browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
